<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ReTech - Composants électroniques récupérés</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="entete">
    <a href="index.html" class="logo">Re<span>Tech - Yesunana</span></a>
    <a href="donner.html" class="btn-don">♻️ Donner vos déchets</a>
  </header>

  <main>
    <section class="hero">
      <h1>Acheter vos composants électroniques récupérés</h1>
    </section>

    <section class="defilement">
      <!--<h2>Composants recyclés issus de plaquettes et déchets électroniques</h2>-->
      <div class="rail">
        <button class="fleche" id="prec" aria-label="Précédent">‹</button>
        <div class="piste" id="piste"></div>
        <button class="fleche" id="suiv" aria-label="Suivant">›</button>
      </div>
    </section>

    <section class="etapes" id="etapes"></section>
  </main>

  <div class="barre-panier" id="barrePanier">
    <span id="resumePanier"></span>
    <button id="btnCommander" class="btn-envoyer">Commander sur WhatsApp</button>
  </div>

  <footer class="pied">© 2026 ReTech - Donnons une seconde vie à l'électronique.</footer>

  <script src="config.js"></script>
  <script src="composants.js"></script>
  <script src="accueil.js"></script>
</body>
</html>
